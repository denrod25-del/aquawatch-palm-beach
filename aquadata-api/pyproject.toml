[project]
name = "aquadata-api"
version = "0.1.0"
description = "AquaData API — metered REST API for US drinking water quality by ZIP (B. Symbolic LLC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "asyncpg>=0.29",
    "redis>=5.0",
    "typer>=0.12",
    "stripe>=10.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RET", "SIM", "ARG", "PL"]
# S101: engineering tier mandates assertions for invariants; we do not run
# python -O in any environment, so asserts are always live.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001"]  # literal expectations; fixture deps for ordering
# Typer's idiom is Option()/Argument() calls in defaults and lazy imports.
"src/aquadata/cli.py" = ["B008", "PLC0415"]
# FastAPI's idiom is Depends() in argument defaults.
"src/aquadata/api/app.py" = ["B008"]
# Curve breakpoints are the methodology constants, documented in methodology.md.
"src/aquadata/core/scoring.py" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
# asyncpg ships no type stubs; its Records/values surface as Any at call sites.
disallow_untyped_calls = false
