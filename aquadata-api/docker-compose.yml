# Local dev stack only. Production runs against the existing VPS Postgres.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aquadata
      POSTGRES_USER: aquadata
      POSTGRES_PASSWORD: aquadata-local-dev # local only; never used in prod
    ports:
      - "127.0.0.1:5432:5432" # loopback only — never expose the dev DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquadata -d aquadata"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
